<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOC Assessment Report · Antoine Savelli</title>
  <style>
    @font-face { font-family: 'Libre Franklin'; src: url('/fonts/LibreFranklin-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Libre Franklin'; src: url('/fonts/LibreFranklin-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'DM Serif Display'; src: url('/fonts/DMSerifDisplay-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
    :root {
      --forest: #456B51; --forest-mid: #4a6b59; --forest-light: #6a9178;
      --cream: #F2F2F2; --cream-dark: #e6e6e1; --off-white: #fafaf8;
      --charcoal: #1c1c1c; --mid: #5a5a5a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Libre Franklin', Arial, sans-serif; background: var(--off-white); color: var(--charcoal); }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 4rem; background: rgba(250,250,248,0.93); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(69,107,81,0.12); }
    .nav-brand { font-family: 'Libre Franklin', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--charcoal); text-decoration: none; }
    .nav-brand em { font-family: 'DM Serif Display', serif; font-style: italic; color: var(--forest); font-weight: 400; }
    .nav-back { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--forest); }
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .gate-box { max-width: 420px; width: 100%; text-align: center; }
    .gate-lock { font-size: 2rem; margin-bottom: 1.5rem; color: var(--forest-light); }
    .gate-title { font-size: 1.4rem; font-weight: 700; color: var(--charcoal); margin-bottom: 0.5rem; }
    .gate-sub { font-size: 0.88rem; font-weight: 300; color: var(--mid); margin-bottom: 2rem; line-height: 1.6; }
    .gate-input { font-family: 'Libre Franklin', sans-serif; font-size: 0.95rem; width: 100%; padding: 0.9rem 1rem; border: 1.5px solid var(--cream-dark); background: var(--cream); color: var(--charcoal); outline: none; text-align: center; letter-spacing: 0.05em; transition: border-color 0.2s; margin-bottom: 1rem; }
    .gate-input:focus { border-color: var(--forest); }
    .gate-input.error { border-color: #c0392b; }
    .gate-btn { font-family: 'Libre Franklin', sans-serif; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; width: 100%; padding: 0.9rem; background: var(--forest); color: var(--cream); border: none; cursor: pointer; transition: background 0.2s; }
    .gate-btn:hover { background: var(--forest-mid); }
    .gate-error { font-size: 0.78rem; color: #c0392b; margin-top: 0.75rem; display: none; }
    #content { display: none; min-height: 100vh; padding-top: 72px; }
    #pdf-frame { width: 100%; height: calc(100vh - 72px); border: none; }
    @media (max-width: 768px) { nav { padding: 1rem 1.5rem; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-brand" href="/">Antoine<em>Savelli</em></a>
  <a class="nav-back" href="/#portfolio">← Portfolio</a>
</nav>

<div id="gate">
  <div class="gate-box">
    <div class="gate-lock">🔒</div>
    <h1 class="gate-title">JOC Assessment Report</h1>
    <p class="gate-sub">Full Johnson O'Connor aptitude assessment results. Passcode required.</p>
    <input type="password" class="gate-input" id="passcode" placeholder="Enter passcode" />
    <button class="gate-btn" onclick="checkPasscode()">View Report</button>
    <p class="gate-error" id="gate-error">Incorrect passcode. Please try again or contact Antoine directly.</p>
  </div>
</div>

<div id="content">
  <iframe id="pdf-frame" src=""></iframe>
</div>

<script>
  document.getElementById('passcode').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPasscode();
  });
  function checkPasscode() {
    const input = document.getElementById('passcode').value;
    const error = document.getElementById('gate-error');
    const inputEl = document.getElementById('passcode');
    if (hashCode(input) === -1804033647) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.getElementById('pdf-frame').src = 'https://antoine-savelli.github.io/protected/JOC%20Assessment%20Report%20Full.pdf';
      error.style.display = 'none';
    } else {
      inputEl.classList.add('error');
      error.style.display = 'block';
      inputEl.value = '';
      setTimeout(() => inputEl.classList.remove('error'), 1500);
    }
  }
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return hash;
  }
</script>

<footer style="background: #1c1c1c; padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center; margin-top: 0;">
  <p style="font-size: 0.72rem; color: #9a9a9a; letter-spacing: 0.06em;">© 2026 Antoine Savelli</p>
  <p style="font-size: 0.72rem; color: #9a9a9a;">v2.0</p>
</footer>
</body>
</html>
